services:
  - type: web
    name: djelis-backend
    env: docker
    region: frankfurt
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: djelis-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: djelis-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production

  - type: psql
    name: djelis-db
    region: frankfurt
    plan: free
    databaseName: djelis
    user: djelis_user
