name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks depuis la release officielle : pas de licence requise
      # (l'action gitleaks-action@v2 en exige une pour les dépôts d'organisation).
      # Bloquant : échoue si un secret est détecté dans l'arbre ou l'historique.
      - name: Secret scan (gitleaks)
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # Rapport de vulnérabilités des dépendances (lockfile unique à la racine).
      # Non bloquant pour l'instant (baseline à trier) — retirer
      # `continue-on-error` une fois le backlog HIGH/CRITICAL résorbé.
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  build-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: djelis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d djelis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/djelis_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/djelis_test?schema=public
      JWT_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Monorepo Dependencies
      run: npm install

    # --- BACKEND CHECKS ---
    - name: Generate Prisma Client (Backend)
      run: npm run prisma:generate --prefix backend

    - name: Lint Backend
      run: npm run lint --prefix backend

    - name: Build Backend
      run: npm run build --prefix backend

    - name: Prepare E2E Database
      run: npm exec --prefix backend -- prisma db push --schema backend/prisma/schema.prisma --skip-generate

    - name: Run E2E Tests (Backend)
      run: npm run test:e2e --prefix backend

    # --- WEB-APP CHECKS ---
    - name: Lint Web-App
      run: npm run lint --prefix web-app

    - name: Build Web-App
      run: npm run build --prefix web-app
      env:
        NEXT_PUBLIC_API_URL: http://localhost:3000
