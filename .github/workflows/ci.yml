name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: djelis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d djelis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/djelis_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/djelis_test?schema=public
      JWT_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Monorepo Dependencies
      run: npm install

    # --- BACKEND CHECKS ---
    - name: Generate Prisma Client (Backend)
      run: npm run prisma:generate --prefix backend

    - name: Lint Backend
      run: npm run lint --prefix backend

    - name: Build Backend
      run: npm run build --prefix backend

    - name: Prepare E2E Database
      run: npm exec --prefix backend -- prisma migrate deploy --schema backend/prisma/schema.prisma

    - name: Run E2E Tests (Backend)
      run: npm run test:e2e --prefix backend

    # --- WEB-APP CHECKS ---
    - name: Lint Web-App
      run: npm run lint --prefix web-app

    - name: Build Web-App
      run: npm run build --prefix web-app
      env:
        NEXT_PUBLIC_API_URL: http://localhost:3000
