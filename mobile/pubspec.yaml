name: djelis_mobile
description: Djeli'S Video and Audio Streaming Mobile Platform (DjaaSoo & DjeliSon)
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^10.0.0

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Network & Cache
  dio: ^5.3.0
  cached_network_image: ^3.3.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0

  # Media Playback
  video_player: ^2.7.0
  chewie: ^1.7.0

  # Design & Icons
  cupertino_icons: ^1.0.5
  google_fonts: ^6.1.0
  url_launcher: ^6.1.11
  audio_session: ^0.1.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
